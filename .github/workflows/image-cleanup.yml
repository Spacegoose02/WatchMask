name: Cleanup Docker Images
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr-cleanup-image:
    name: ghcr cleanup action
    runs-on: ubuntu-latest

    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: watchmask
          keep-n-untagged: 15
          delete-ghost-images: true
          delete-orphaned-images: true
          validate: true

      # PR builds no longer publish, but pr-N tags pushed before that fix are
      # still sitting in the package: keep-n-untagged only prunes untagged
      # manifests, so nothing ever collected them. Scoped to the pr-* glob, so
      # latest/release/vX.Y.Z are untouched.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: watchmask
          delete-tags: pr-*
          validate: true
