<a href="{{ url }}"
   target="_blank"
   rel="noopener"
   title="Open {{ link.title|default:'this game' }} on LootDen{% if link.last_played_at %} (last played {{ link.last_played_at|date:'M j, Y' }}){% endif %}"
   class="inline-flex h-11 w-full flex-1 items-center justify-center gap-2 rounded-xl border border-indigo-500/60 bg-indigo-600 px-4 text-sm font-medium text-white shadow-sm transition-colors duration-200 hover:bg-indigo-500 sm:w-auto sm:flex-none">
  {% include "app/icons/play.svg" with classes="w-4 h-4" %}
  Play on LootDen
</a>
