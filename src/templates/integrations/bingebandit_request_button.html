{% if requested %}
  <span class="inline-flex h-11 w-full flex-1 items-center justify-center gap-2 rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-4 text-sm font-medium text-[var(--color-success-text)] sm:w-auto sm:flex-none">
    {% include "app/icons/checkmark.svg" with classes="w-4 h-4" %}
    Requested on BingeBandit
  </span>
{% elif error %}
  <span class="inline-flex h-11 w-full flex-1 items-center justify-center rounded-xl border border-amber-400/30 bg-amber-500/10 px-4 text-sm text-amber-200 sm:w-auto sm:flex-none">{{ error }}</span>
{% else %}
  <button type="button"
          hx-post="{% url 'bingebandit_request' media_type tmdb_id %}"
          hx-swap="outerHTML"
          hx-disabled-elt="this"
          title="Ask your BingeBandit server to add this"
          class="inline-flex h-11 w-full flex-1 cursor-pointer items-center justify-center gap-2 rounded-xl border border-indigo-500/60 bg-transparent px-4 text-sm font-medium text-indigo-200 transition-colors duration-200 hover:bg-indigo-600/20 sm:w-auto sm:flex-none">
    Request on BingeBandit
  </button>
{% endif %}
